<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
      #icon {
        display: block;
      }
    </style>
  </head>
  <body>
    <!--
      Kafka Offset Harbor logo: the product initials "koh" set on a rounded
      tile with a material-style diagonal gradient (brand blue #0058A3).
    -->
    <svg id="icon" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#3E9BFF" />
          <stop offset="52%" stop-color="#0058A3" />
          <stop offset="100%" stop-color="#00396E" />
        </linearGradient>
        <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
        </linearGradient>
        <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00203E" flood-opacity="0.30" />
        </filter>
      </defs>

      <!-- gradient tile -->
      <rect x="32" y="32" width="960" height="960" rx="216" ry="216" fill="url(#tile)" />
      <!-- soft top sheen for material depth -->
      <rect x="32" y="32" width="960" height="470" rx="216" ry="216" fill="url(#sheen)" />

      <!-- product initials -->
      <text
        x="512"
        y="545"
        text-anchor="middle"
        dominant-baseline="central"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-weight="800"
        font-size="400"
        letter-spacing="-14"
        fill="#FFFFFF"
        filter="url(#lift)"
      >koh</text>
    </svg>
  </body>
</html>
